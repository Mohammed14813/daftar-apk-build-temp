name: Build Daftar APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake
      - name: Install Python build tools
        run: python3 -m pip install --upgrade pip buildozer cython==0.29.37
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true
      - name: Build debug APK
        working-directory: build
        run: buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daftar-apk
          path: build/bin/*.apk
          if-no-files-found: error
