name: Build Daftar APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ANDROIDSDK: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake
      - name: Install Python build tools
        run: python3 -m pip install --upgrade pip buildozer cython==0.29.37
      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          mkdir -p "$HOME/.buildozer/android/platform/android-sdk/licenses"
          if [ -d "$ANDROID_HOME/licenses" ]; then cp -f "$ANDROID_HOME/licenses/"* "$HOME/.buildozer/android/platform/android-sdk/licenses/" || true; fi
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;37.0.0" "platforms;android-35" || true
      - name: Build debug APK
        working-directory: build
        run: |
          export ANDROIDSDK="$ANDROID_HOME"
          export ANDROID_HOME="$ANDROIDSDK"
          buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daftar-apk
          path: build/bin/*.apk
          if-no-files-found: error
